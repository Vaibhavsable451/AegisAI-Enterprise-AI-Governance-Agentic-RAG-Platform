name: AegisAI CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/vaibhavsable451/aegisai-enterprise-ai-governance-agentic-rag-platform-app
  MLFLOW_IMAGE_NAME: ghcr.io/vaibhavsable451/aegisai-enterprise-ai-governance-agentic-rag-platform-mlflow
  FRONTEND_IMAGE_NAME: ghcr.io/vaibhavsable451/aegisai-enterprise-ai-governance-agentic-rag-platform-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./aegis-frontend
          file: ./aegis-frontend/Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Build and push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.mlflow
          push: true
          tags: |
            ${{ env.MLFLOW_IMAGE_NAME }}:${{ github.sha }}
            ${{ env.MLFLOW_IMAGE_NAME }}:latest
