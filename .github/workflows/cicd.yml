name: AegisAI CI / CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vaibhavsable451

  APP_IMAGE: aegisai-enterprise-ai-governance-agentic-rag-platform-app
  FRONTEND_IMAGE: aegisai-enterprise-ai-governance-agentic-rag-platform-frontend
  MLFLOW_IMAGE: aegisai-enterprise-ai-governance-agentic-rag-platform-mlflow

jobs:

  # ============================================================
  # BUILD & PUSH DOCKER IMAGES
  # ============================================================

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # BACKEND IMAGE METADATA
      # ----------------------------------------------------------

      - name: Backend image metadata
        id: app-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.APP_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ----------------------------------------------------------
      # FRONTEND IMAGE METADATA
      # ----------------------------------------------------------

      - name: Frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ----------------------------------------------------------
      # MLFLOW IMAGE METADATA
      # ----------------------------------------------------------

      - name: MLflow image metadata
        id: mlflow-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.MLFLOW_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ==========================================================
      # BACKEND
      # ==========================================================

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app-meta.outputs.tags }}
          labels: ${{ steps.app-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ==========================================================
      # FRONTEND
      # ==========================================================

      - name: Build and push frontend image
        if: ${{ hashFiles('aegis-frontend/Dockerfile') != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./aegis-frontend
          file: ./aegis-frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # ==========================================================
      # MLFLOW
      # ==========================================================

      - name: Build and push MLflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.mlflow
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.mlflow-meta.outputs.tags }}
          labels: ${{ steps.mlflow-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64


  # ============================================================
  # DEPLOY TO EC2
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs:
      - build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # SSH INTO EC2
      # ----------------------------------------------------------

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo "=========================================="
            echo "AegisAI EC2 Deployment Started"
            echo "=========================================="

            # ----------------------------------------------------
            # GO TO PROJECT
            # ----------------------------------------------------

            cd ~/AegisAI-Enterprise-AI-Governance-Agentic-RAG-Platform

            echo "Current directory:"
            pwd

            # ----------------------------------------------------
            # PULL LATEST CODE
            # ----------------------------------------------------

            echo "Pulling latest GitHub changes..."

            git fetch origin main
            git reset --hard origin/main

            # ----------------------------------------------------
            # CHECK DOCKER
            # ----------------------------------------------------

            echo "Docker version:"
            sudo docker --version

            echo "Docker Compose version:"
            sudo docker compose version

            # ----------------------------------------------------
            # LOGIN TO GHCR
            # ----------------------------------------------------
            #
            # IMPORTANT:
            # GitHub Actions passes GHCR credentials through
            # environment variables below.
            #
            # GHCR_USERNAME and GHCR_TOKEN must be configured
            # as GitHub repository secrets.
            #
            # ----------------------------------------------------

            echo "Logging into GHCR..."

            echo "${{ secrets.GHCR_TOKEN }}" | \
              sudo docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            # ----------------------------------------------------
            # PULL LATEST IMAGES
            # ----------------------------------------------------

            echo "Pulling latest Docker images..."

            sudo docker compose pull

            # ----------------------------------------------------
            # START / RECREATE SERVICES
            # ----------------------------------------------------

            echo "Starting services..."

            sudo docker compose up -d --remove-orphans

            # ----------------------------------------------------
            # WAIT FOR SERVICES
            # ----------------------------------------------------

            echo "Waiting for containers..."

            sleep 15

            # ----------------------------------------------------
            # SHOW STATUS
            # ----------------------------------------------------

            echo "=========================================="
            echo "Docker Compose Status"
            echo "=========================================="

            sudo docker compose ps

            # ----------------------------------------------------
            # SHOW RUNNING CONTAINERS
            # ----------------------------------------------------

            echo "=========================================="
            echo "Running Containers"
            echo "=========================================="

            sudo docker ps

            # ----------------------------------------------------
            # BACKEND HEALTH CHECK
            # ----------------------------------------------------

            echo "=========================================="
            echo "Backend Health Check"
            echo "=========================================="

            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Backend health check PASSED."
            else
              echo ""
              echo "Backend health endpoint failed."
              echo "Showing backend logs..."
              sudo docker compose logs --tail=100 app || true
              exit 1
            fi

            # ----------------------------------------------------
            # API ROOT CHECK
            # ----------------------------------------------------

            echo "=========================================="
            echo "API Root Check"
            echo "=========================================="

            curl -fsS http://127.0.0.1:8000/ || true

            echo ""

            # ----------------------------------------------------
            # FINAL
            # ----------------------------------------------------

            echo "=========================================="
            echo "AegisAI Deployment Successful"
            echo "=========================================="
